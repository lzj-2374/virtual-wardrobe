server:
  port: 8080
  servlet:
    # 前端 vite 代理把 /api 原样转发到 8080，不做 rewrite，所以后端必须有这个前缀
    context-path: /api

spring:
  application:
    name: wardrobe
  config:
    # 密钥不进仓库、也不用手粘到 IDEA 里：放在工程根目录的 config/secrets.yml，启动时自动读进来。
    # optional: 没有这个文件也能启动（走本地降级），所以 clone 下来不配密钥照样跑得起来。
    # 如果 IDEA 运行配置里还留着 OSS_AK / OSS_SK 这类环境变量，请删掉，别让两处配置打架。
    # 到底用的是哪一把，看启动日志那行「OSS 客户端初始化：AK=...***」就知道了。
    import: optional:file:./config/secrets.yml
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "jdbc:mysql://localhost:3306/virtual_wardrobe?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"
    username: root
    password: 1234
    hikari:
      # 建库之前也能正常启动；-1 表示启动时不去校验连接。数据库建好后可以删掉这行
      initialization-fail-timeout: -1
  data:
    redis:
      # token 白名单存在这里。默认走本机（Docker 里的 wardrobe-redis），
      # 换机器或换 Redis 地址时不用改文件，加环境变量 REDIS_HOST 即可
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: 1
      # Redis 连不上时不要卡 60 秒才报错，1 秒内失败，交给过滤器按"未登录"处理
      timeout: 2000ms

  # RabbitMQ：只服务 AI 生图异步任务。
  # ${环境变量:默认值} 的写法和下面 OSS 一致，MQ 装在哪台机器就改默认值或注入环境变量。
  # 注意：RabbitMQ 自带的 guest 默认只允许 localhost 登录，远程连虚拟机要另建用户并授权 vhost。
  rabbitmq:
    # 本机 Docker 里的 RabbitMQ（管理台 http://localhost:15672，guest/guest）。
    # 之前误写成 Redis 那台虚拟机的地址，导致连不上；远程装 MQ 时用环境变量覆盖即可。
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    virtual-host: "${RABBITMQ_VHOST:/}"
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PWD:guest}
    # 生产者确认：消息是否真的到了交换机，配合 RabbitTemplate.setConfirmCallback 使用。
    # 交换机收不到队列时 confirm 仍是 ack，所以还要靠 returns 兜住"路由丢失"。
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        # Spring 的 auto ≠ 原生 autoAck：方法正常返回才 ack，抛异常会重新入队。
        # 必须关掉无限重投，否则图生图 API 一失败就反复重放，按次收费的额度会被刷光。
        acknowledge-mode: auto
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms
          multiplier: 2
          max-interval: 10000ms
          stateless: true
        # 生图 10~30s 且按次收费：这里要主动限流，不是加消费者
        concurrency: 1
        max-concurrency: 2
        prefetch: 1

  servlet:
    multipart:
      # 默认只有 1MB，手机拍的照片动辄 3~5MB，不调大上传接口直接抛 MaxUploadSizeExceededException
      max-file-size: 10MB
      max-request-size: 10MB

# 阿里云 OSS 配置。
# 写法是 ${环境变量名:默认值}：优先读环境变量，读不到才用冒号后面的默认值。
# 本地开发图省事直接用了默认值，但这些默认值等于明文密钥，正式上线 / 提交公开仓库前
# 必须改成只在 IDEA 运行配置或服务器环境变量里给，别留在文件里。
# 已改成不带默认值：本地跑之前先在 IDEA 运行配置或系统环境变量里给 OSS_AK / OSS_SK，否则上传会报错。
aliyun:
  oss:
    endpoint: ${OSS_ENDPOINT:oss-cn-beijing.aliyuncs.com}
    access-key-id: ${OSS_AK:}
    access-key-secret: ${OSS_SK:}
    bucket-name: ${OSS_BUCKET:lzj-wardrobe-ai}
    # 对象 key 的统一前缀，方便以后在 OSS 控制台按目录区分：wardrobe/clothing/xxx.jpg
    dir-prefix: ${OSS_DIR:wardrobe}

# ===== AI 能力配置 =====
# 两组 key 都可以留空，留空会自动降级，功能语义不变、只是"聪明程度"下降：
#   ai.llm.api-key   为空 → 不走 DeepSeek，改用内置规则引擎（从真实衣柜里按场景/季节/品类挑）
#   ai.image.api-key 为空 → 不走通义万相，改用服务端合成（拿真实单品图拼效果图）
# 密钥永远只走环境变量，不写死在文件里：这东西一旦提交到公开仓库就等于送人。
ai:
  llm:
    provider: ${AI_LLM_PROVIDER:auto}      # auto / deepseek / rule
    api-key: ${DEEPSEEK_API_KEY:}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    model: ${DEEPSEEK_MODEL:deepseek-chat}
    timeout: 60s
    max-tokens: 1200
    # 搭配推荐要稳定可复现，温度调低一点，不然同一个问题两次给出完全不同的组合
    temperature: 0.3
  image:
    provider: ${AI_IMAGE_PROVIDER:auto}    # auto / wanx / composite
    api-key: ${DASHSCOPE_API_KEY:}
    base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com}
    # wan2.5-i2i-preview：图生图编辑，单次最多 3 张输入、出图上限 1280。
    # 不要换回 wanx2.1-imageedit：那是 Legacy 模型，实测只会把衣服重画成电商主图，
    # 加不进"模特上身"，而且会自己编品牌文字。两者 input 结构不同，换模型不是改个名字就行。
    model: ${DASHSCOPE_IMAGE_MODEL:wan2.5-i2i-preview}
    timeout: 180s
    width: 768
    height: 1024

jwt:
  # HS256 算法要求密钥至少 32 字节（256 位），太短第一次签发 token 时会抛 WeakKeyException。
  # 默认值只是本地开发用，知道这个串的人能伪造任意用户的 token，上线必须用 JWT_SECRET 覆盖。
  secret: ${JWT_SECRET:wardrobe-jwt-secret-2026-local-dev-only-9f3a7c1e5b8d2a64}
  # token 有效期，单位秒。7200 = 2 小时
  expire: 7200

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.liuzhangjie.wardrobe.entity
  configuration:
    map-underscore-to-camel-case: true
    # 开发期把 SQL 打到控制台，方便看 MP 到底生成了什么语句；上线要关掉
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      # 主键自增，不用雪花 ID（雪花 19 位会超出 JS 精度）
      id-type: auto
      # 逻辑删除字段，实体里加 @TableLogic 或者同名 deleted 字段即可生效
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.liuzhangjie.wardrobe: debug
